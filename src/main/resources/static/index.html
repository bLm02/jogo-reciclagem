<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♻️ Jogo de Reciclagem - 10 Rodadas</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        }

        body{
            background:url('images/backgroud/fundo-jogo.jpg');
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:10px;
        }

        .game-container{
            background:#f0f7e6;
            border-radius:35px;
            padding:18px 25px;
            box-shadow:0 20px 40px rgba(0,0,0,0.3);
            max-width:1000px;
            width:100%;
            max-height:calc(100vh - 20px);
            overflow:auto;
            position:relative;
        }

        .manual-btn{
            position:absolute;
            top:15px;
            right:15px;
            width:42px;
            height:42px;
            border-radius:50%;
            border:none;
            background:#ffb347;
            color:#1e3c3f;
            font-size:26px;
            font-weight:bold;
            cursor:pointer;
            box-shadow:0 5px 15px rgba(0,0,0,0.25);
            display:flex;
            align-items:center;
            justify-content:center;
            text-decoration:none;
            transition:transform 0.3s, background 0.3s;
        }

        .manual-btn:hover{
            transform:scale(1.1);
            background:#ffd27f;
        }

        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:15px;
            background:#2d5a5e;
            padding:12px 25px;
            border-radius:30px;
            color:white;
        }

        .round-info{
            font-size:20px;
            font-weight:bold;
            background:#ffb347;
            padding:8px 20px;
            border-radius:30px;
            color:#1e3c3f;
        }

        .score-info{
            font-size:22px;
            font-weight:bold;
            background:#ff6f61;
            padding:8px 20px;
            border-radius:30px;
        }

        .attempts-info{
            font-size:18px;
            background:#4a8b8f;
            padding:8px 20px;
            border-radius:30px;
        }

        .lixeira-section{
            background:#d9e6d9;
            border-radius:30px;
            padding:12px;
            margin-bottom:15px;
            text-align:center;
        }

        .lixeira-title{
            font-size:18px;
            color:#1e3c3f;
            margin-bottom:5px;
            font-weight:bold;
        }

        .lixeira-card{
        background:#d9e6d9;
        padding:0;
        border-radius:30px;
        display:inline-block;
        min-width:auto;
        box-shadow:none;
        border:none;
        cursor:pointer;
        transition:transform 0.3s;
    }

        .lixeira-card:hover{
            transform:scale(1.02);
        }

        .lixeira-icon{
            margin-bottom:0;
        }

        .lixeira-icon img{
            width:260px;
            height:260px;
            object-fit:contain;
            display:block;
        }

        .itens-section{
            margin-bottom:15px;
        }

        .itens-grid{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:12px;
            margin-top:10px;
        }

        .item-card{
            background:white;
            border-radius:22px;
            padding:12px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
            cursor:grab;
            transition:all 0.3s;
            border:3px solid #4a8b8f;
            user-select:none;
        }

        .item-card:hover{
            transform:scale(1.05);
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .item-icon{
            width:75px;
            height:75px;
            margin:0 auto 6px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .item-icon img{
            width:75px;
            height:75px;
            object-fit:contain;
            display:block;
        }

        .item-nome{
            font-size:16px;
            font-weight:bold;
            color:#1e3c3f;
            margin-bottom:0;
        }

        .message-area{
            background:#ffb347;
            border-radius:25px;
            padding:12px;
            margin:12px 0;
            text-align:center;
            font-size:20px;
            font-weight:bold;
            color:#1e3c3f;
            min-height:55px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .next-round-btn{
            background:#2d5a5e;
            color:white;
            border:none;
            padding:14px 30px;
            font-size:22px;
            font-weight:bold;
            border-radius:30px;
            cursor:pointer;
            width:100%;
            display:none;
        }

        .reset-btn{
            background:#ff6f61;
            color:white;
            border:none;
            padding:15px 30px;
            font-size:20px;
            font-weight:bold;
            border-radius:30px;
            cursor:pointer;
            margin-top:20px;
        }

        .final-score{
            text-align:center;
            padding:40px;
            background:white;
            border-radius:40px;
        }

        .hidden{
            display:none !important;
        }

        .drag-over{
            background:#e0f0e0 !important;
            border-color:#4CAF50 !important;
        }

        /* Estilos do Menu Inicial */
        .start-menu {
            text-align: center;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        .start-menu h1 {
            color: #1e3c3f;
            margin-bottom: 40px;
            font-size: 42px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 300px;
        }

        .menu-btn {
            padding: 18px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 35px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .play-btn {
            background: #4CAF50;
            color: white;
        }

        .play-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .tutorial-btn {
            background: #ffb347;
            color: #1e3c3f;
        }

        .tutorial-btn:hover {
            background: #ffa726;
            transform: scale(1.05);
        }

        .name-input {
            padding: 15px;
            border-radius: 20px;
            border: 3px solid #2d5a5e;
            font-size: 20px;
            width: 100%;
            max-width: 300px;
            text-align: center;
            margin-bottom: 25px;
            color: #1e3c3f;
            outline: none;
        }

        .name-input:focus {
            border-color: #ffb347;
        }

        .final-message {
            font-size: 24px;
            color: #1e3c3f;
            margin: 20px 0 30px;
            font-weight: bold;
            line-height: 1.4;
        }

        /* Estilos do Modal de Tutorial */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-container {
            background: white;
            width: 90%;
            max-width: 800px;
            height: 85%;
            border-radius: 25px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 35px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            z-index: 1001;
            background: #ff6f61;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            line-height: 1;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .modal-close:hover {
            transform: scale(1.1);
        }

        .modal-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

    </style>
</head>

<body>

<div class="game-container">

    <!-- Menu Inicial -->
    <div id="startMenu" class="start-menu">
        <h1>♻️ Jogo de Reciclagem</h1>
        <input type="text" id="playerName" class="name-input" placeholder="Digite seu nome...">
        <div class="menu-buttons">
            <button class="menu-btn play-btn" onclick="comecarJogo()">
                🎮 JOGAR
            </button>
            <button class="menu-btn tutorial-btn" onclick="abrirTutorial()">
                📖 TUTORIAL
            </button>
        </div>
    </div>

    <!-- Conteúdo do Jogo -->
    <div id="gameContent" class="hidden">

        <button class="manual-btn" onclick="abrirTutorial()" title="Abrir manual do jogo">
            ?
        </button>

        <div class="header">
            <div class="round-info" id="roundDisplay">Rodada 1/10</div>
            <div class="score-info" id="scoreDisplay">0 Pontos</div>
            <div class="attempts-info" id="attemptsDisplay">1ª tentativa: 10 pontos</div>
        </div>

        <div id="gameArea">

            <div class="lixeira-section">
                <div class="lixeira-title">Arraste um item para a lixeira:</div>

                <div class="lixeira-card" id="lixeiraAtual">

                    <div class="lixeira-icon" id="lixeiraIcon"></div>

                </div>
            </div>

            <div class="itens-section">

                <h3 style="color:#1e3c3f;margin-bottom:15px;">
                    Escolha um item para reciclar:
                </h3>

                <div class="itens-grid" id="itensGrid"></div>

            </div>

            <div class="message-area" id="messageArea">
                Arraste um item para a lixeira
            </div>

            <button class="next-round-btn" id="nextRoundBtn" onclick="proximaRodada()">
                ▶️ PRÓXIMA RODADA
            </button>

        </div>

        <div id="finalScoreArea" class="final-score hidden">

            <h2> FIM DE JOGO! </h2>

            <p id="finalScoreDisplay" style="font-size: 60px; font-weight: bold; color: #ff6f61; margin: 10px 0;">0</p>
            
            <p id="finalMessage" class="final-message"></p>

            <button class="reset-btn" onclick="voltarAoMenu()">
                🔄 JOGAR NOVAMENTE
            </button>

        </div>

    </div>

</div>

<!-- Modal de Tutorial -->
<div id="tutorialModal" class="modal-overlay" onclick="fecharTutorialFora(event)">
    <div class="modal-container">
        <span class="modal-close" onclick="fecharTutorial()">&times;</span>
        <iframe src="manual_jogo_reciclagem.html" class="modal-iframe"></iframe>
    </div>
</div>

<script>

    let sessionId = null;
    let pontuacaoAtual = 0;

    const roundDisplay=document.getElementById('roundDisplay');
    const scoreDisplay=document.getElementById('scoreDisplay');
    const attemptsDisplay=document.getElementById('attemptsDisplay');

    const lixeiraIcon=document.getElementById('lixeiraIcon');

    const itensGrid=document.getElementById('itensGrid');
    const messageArea=document.getElementById('messageArea');

    const nextRoundBtn=document.getElementById('nextRoundBtn');
    const lixeiraCard=document.getElementById('lixeiraAtual');

    const finalScoreArea=document.getElementById('finalScoreArea');
    const finalScoreDisplay=document.getElementById('finalScoreDisplay');

    async function comecarJogo() {
        const inputNome = document.getElementById('playerName');
        const nome = inputNome.value.trim();

        if (!nome) {
            alert("Por favor, digite seu nome para começar!");
            inputNome.focus();
            return;
        }

        try {
            const response = await fetch('/api/jogo/iniciar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nomeJogador: nome })
            });

            if (!response.ok) {
                throw new Error('Falha ao iniciar o jogo');
            }

            const dados = await response.json();
            sessionId = dados.sessionId;
            pontuacaoAtual = 0;

            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameContent').classList.remove('hidden');
            document.getElementById('gameArea').classList.remove('hidden');
            finalScoreArea.classList.add('hidden');
            scoreDisplay.textContent = "0 Pontos";

            exibirRodada(dados.rodada);
        } catch (error) {
            console.error("Erro ao iniciar jogo:", error);
            alert("Erro ao conectar com o servidor. Verifique se o backend está rodando.");
        }
    }

    function exibirRodada(rodada){

        roundDisplay.textContent=`Rodada ${rodada.numeroRodada}/${rodada.totalRodadas}`;
        atualizarTentativas(rodada.tentativaAtual, rodada.pontosProximaTentativa);

        lixeiraIcon.innerHTML=`<img src="${rodada.lixeira.imagemUrl}" alt="${rodada.lixeira.nome}">`;

        itensGrid.innerHTML='';

        rodada.opcoes.forEach(item=>{

            const card=document.createElement('div');
            card.className='item-card';
            card.draggable=true;

            card.innerHTML=`
    <div class="item-icon"><img src="${item.imagemUrl}" alt="${item.nome}"></div>
    <div class="item-nome">${item.nome}</div>
    `;

            card.addEventListener('dragstart',e=>{
                e.dataTransfer.setData('id',item.id);
            });

            itensGrid.appendChild(card);

        });

        messageArea.innerHTML="Arraste um item para a lixeira";
        nextRoundBtn.style.display="none";

    }

    function atualizarTentativas(tentativaAtual, pontosProximaTentativa){
        attemptsDisplay.textContent=`${tentativaAtual}ª tentativa: ${pontosProximaTentativa} pontos`;
    }

    lixeiraCard.addEventListener('dragover',e=>{
        e.preventDefault();
    });

    lixeiraCard.addEventListener('drop',e=>{

        const id=e.dataTransfer.getData('id');

        processarJogada(parseInt(id));

    });

    async function processarJogada(itemId) {
        if (!sessionId) return;

        try {
            const response = await fetch(`/api/jogo/${sessionId}/jogada`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ itemId })
            });

            if (!response.ok) {
                throw new Error('Falha ao processar jogada');
            }

            const resultado = await response.json();
            pontuacaoAtual = resultado.pontuacaoTotal;
            scoreDisplay.textContent = `${pontuacaoAtual} Pontos`;

            if (resultado.acertou) {
                messageArea.innerHTML = "🎉 ACERTOU!";

                if (resultado.jogoFinalizado) {
                    finalizarJogo(resultado.mensagemFinal);
                } else {
                    nextRoundBtn.style.display = "block";
                }
            } else {
                atualizarTentativas(resultado.tentativaAtual, resultado.pontosProximaTentativa);
                messageArea.innerHTML = "❌ ERROU!";
            }
        } catch (error) {
            console.error("Erro ao processar jogada:", error);
            alert("Erro ao conectar com o servidor.");
        }
    }

    async function proximaRodada(){
        if (!sessionId) return;

        nextRoundBtn.style.display="none";

        try {
            const response = await fetch(`/api/jogo/${sessionId}/proxima-rodada`, { method: 'POST' });

            if (!response.ok) {
                throw new Error('Falha ao avançar rodada');
            }

            const rodada = await response.json();
            exibirRodada(rodada);
        } catch (error) {
            console.error("Erro ao avançar rodada:", error);
            alert("Erro ao conectar com o servidor.");
        }
    }

    function voltarAoMenu() {
        sessionId = null;
        document.getElementById('gameContent').classList.add('hidden');
        document.getElementById('startMenu').classList.remove('hidden');
        document.getElementById('playerName').focus();
    }

    function finalizarJogo(mensagemFinal){

        document.getElementById('gameArea').classList.add('hidden');

        finalScoreArea.classList.remove('hidden');

        finalScoreDisplay.textContent=pontuacaoAtual + " Pontos";

        document.getElementById('finalMessage').textContent = mensagemFinal;

    }

    function abrirTutorial() {
        document.getElementById('tutorialModal').style.display = 'flex';
    }

    function fecharTutorial() {
        document.getElementById('tutorialModal').style.display = 'none';
    }

    function fecharTutorialFora(event) {
        if (event.target.id === 'tutorialModal') {
            fecharTutorial();
        }
    }

    window.onload = function() {
        document.getElementById('playerName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                comecarJogo();
            }
        });
    };

</script>

</body>
</html>
